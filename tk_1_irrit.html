<p>[İsim] olumsuz veya huysuz bir ruh halindeydi.</p>

<h2>Açıklama:</h2>
<p>Mutsuz, huysuz, kolay hayal kırıklığına uğrayan veya çabuk öfkelenen/üzülen bir ruh hali göstermesi.</p>
